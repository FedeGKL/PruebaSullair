name: CI-CD Pipeline Medallion Automático

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ETAPA 1: Validación y Despliegue en DEV
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validar y Desplegar en DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
          databricks bundle run medallion_etl_job -t dev

      # PASO DE AUTOMATIZACIÓN DEL TAG
      - name: Generar y Publicar Tag Automático para Producción
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TAG="v1.0.$(date +%s)"
          echo "Despliegue en DEV exitoso. Creando el tag automático: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG

  # ETAPA 2: Despliegue a PRODUCCIÓN
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del artefacto versionado
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Desplegar en PROD
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t prod
          databricks bundle deploy -t prod