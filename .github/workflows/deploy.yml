name: CI-CD Pipeline Medallion Automático

on:
  push:
    branches:
      - main     # Se dispara únicamente ante cambios/merge en main

jobs:
  # ETAPA 1: Validación y Despliegue en DEV
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validar y Desplegar en DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
          databricks bundle run medallion_etl_job -t dev

  # ETAPA 2: Despliegue en PROD (Encadenado a DEV)
  deploy-prod:
    needs: deploy-dev    # <--- AQUÍ: Solo se ejecuta si 'deploy-dev' finalizó en VERDE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validar y Desplegar en PROD
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t prod
          databricks bundle deploy -t prod