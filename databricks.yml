bundle:
  name: PruebaSullair

include:
  - resources/*.yml

variables:
  environment:
    description: "Ambiente de ejecucion de procceso: dev o prod"
    default: "dev"

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: "dev"

  prod:
    mode: production
    variables:
      environment: "prod"