resources:
  jobs:
    medallion_etl_job:
      name: "[${bundle.target}] Pipeline Medallion Demo"
      tasks:
        - task_key: procesar_capas
          notebook_task:
            notebook_path: ../src/procesar_medallion
            base_parameters:
              environment: ${var.environment}
          # Configuramos un cluster single-node mínimo para no generar costos extra.
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge" 
            num_workers: 0
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"