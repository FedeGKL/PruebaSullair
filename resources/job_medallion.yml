resources:
  jobs:
    medallion_etl_job:
      name: "[${bundle.target}] Pipeline Medallion Demo"
      tasks:
        - task_key: procesar_capas
          notebook_task:
            notebook_path: ../src/procesar_medallion.ipynb
            base_parameters:
              environment: ${var.environment}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED